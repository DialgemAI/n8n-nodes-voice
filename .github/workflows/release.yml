name: Release

# Publishes @dialgem/n8n-nodes-voice to npm when a tag `v<version>` is pushed, e.g.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Same method as @dialgem/sdk (dialgem-sdk-typescript). Provenance is attached, which n8n requires
# for a verified community node.
#
# Auth: npm trusted publishing (OIDC, no stored token), configured for @dialgem/n8n-nodes-voice on
# npmjs.com -> Settings -> Trusted Publisher -> GitHub Actions (repo DialgemAI/n8n-nodes-dialgem,
# workflow release.yml, environment npm). An `NPM_TOKEN` secret is used instead if set; the very
# first publish of a new package needs it, because the package must exist before a trusted
# publisher can be configured for it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure required reviewers on this environment to gate every release.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, for the on-main check below.
          fetch-depth: 0

      # A tag can be pushed on any commit, including one never reviewed or merged.
      - name: Tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main." >&2
            exit 1
          fi

      - name: Tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # --ignore-scripts: n8n-workflow (a dev dependency, used by the tests) pulls in isolated-vm, a
      # native module that is not used here and does not compile on every Node version.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

      # The package must ship only the compiled node and credential, the icon, the README and the licence.
      - name: Package contents
        run: node scripts/check-pack.js

      # npm 11.5+ is needed for trusted publishing.
      - name: Publish
        run: |
          npm install -g npm@11
          # A version containing a hyphen (0.2.0-beta.1) goes to the `next` dist-tag,
          # so installing by name never picks up a prerelease.
          tag=latest
          case "$(node -p "require('./package.json').version")" in *-*) tag=next ;; esac
          provenance=""
          if [ "$REPO_PRIVATE" = "false" ]; then provenance="--provenance"; fi
          npm publish $provenance --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
